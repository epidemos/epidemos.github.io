<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Epidemos logo">
  <title>Epidemos</title>
  <defs>
    <radialGradient id="globeBg" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#0D2545"/>
      <stop offset="100%" stop-color="#04101E"/>
    </radialGradient>
    <linearGradient id="epicurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <clipPath id="gc">
      <circle cx="60" cy="60" r="53"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow rings -->
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#06B6D4" stroke-width="0.4" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#06B6D4" stroke-width="0.6" opacity="0.18"/>

  <!-- Globe fill -->
  <circle cx="60" cy="60" r="54" fill="url(#globeBg)"/>

  <!-- Globe border -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#06B6D4" stroke-width="1.4"/>

  <!-- Geographic grid (clipped, very subtle) -->
  <g clip-path="url(#gc)" fill="none" stroke="#0F2D4A" stroke-width="0.55">
    <line x1="60" y1="7" x2="60" y2="113"/>
    <line x1="7" y1="60" x2="113" y2="60"/>
    <ellipse cx="60" cy="60" rx="54" ry="18"/>
    <ellipse cx="60" cy="60" rx="54" ry="36"/>
    <ellipse cx="60" cy="60" rx="18" ry="54"/>
    <ellipse cx="60" cy="60" rx="36" ry="54"/>
  </g>

  <!-- Epidemiological curve - gradual exponential rise -->
  <path d="M 14,96 C 22,92 30,86 39,79 S 50,67 58,58 S 68,47 79,37 S 93,26 106,20"
    fill="none"
    stroke="url(#epicurve)"
    stroke-width="2.6"
    stroke-linecap="round"
    clip-path="url(#gc)"
    filter="url(#glow)"/>

  <!-- Data points along curve -->
  <circle cx="14" cy="96" r="2.8" fill="#10B981" clip-path="url(#gc)"/>
  <circle cx="31" cy="86" r="2.8" fill="#10B981" clip-path="url(#gc)"/>
  <circle cx="49" cy="72" r="2.8" fill="#06B6D4" clip-path="url(#gc)"/>
  <circle cx="67" cy="56" r="2.8" fill="#06B6D4" clip-path="url(#gc)"/>
  <circle cx="84" cy="41" r="2.8" fill="#38BDF8" clip-path="url(#gc)"/>

  <!-- Peak point — alert (red) -->
  <circle cx="101" cy="27" r="3.5" fill="#EF4444" clip-path="url(#gc)" filter="url(#redglow)"/>
  <circle cx="101" cy="27" r="6.5" fill="none" stroke="#EF4444" stroke-width="0.8" opacity="0.35" clip-path="url(#gc)"/>
</svg>
