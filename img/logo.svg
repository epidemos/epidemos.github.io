<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Epidemos logo">
  <title>Epidemos</title>
  <defs>
    <radialGradient id="globeBg" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#0D2545"/>
      <stop offset="100%" stop-color="#04101E"/>
    </radialGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="48%"  stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <clipPath id="gc">
      <circle cx="60" cy="60" r="53"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer glow rings -->
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#06B6D4" stroke-width="0.4" opacity="0.12"/>
  <circle cx="60" cy="60" r="56"   fill="none" stroke="#06B6D4" stroke-width="0.6" opacity="0.18"/>

  <!-- Globe fill -->
  <circle cx="60" cy="60" r="54" fill="url(#globeBg)"/>

  <!-- Globe border -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#06B6D4" stroke-width="1.4"/>

  <!-- Geographic grid (very subtle) -->
  <g clip-path="url(#gc)" fill="none" stroke="#0F2D4A" stroke-width="0.55">
    <line x1="60" y1="7"   x2="60"  y2="113"/>
    <line x1="7"  y1="60"  x2="113" y2="60"/>
    <ellipse cx="60" cy="60" rx="54" ry="18"/>
    <ellipse cx="60" cy="60" rx="54" ry="36"/>
    <ellipse cx="60" cy="60" rx="18" ry="54"/>
    <ellipse cx="60" cy="60" rx="36" ry="54"/>
  </g>

  <!-- Epidemic curve baseline (x-axis / time axis) -->
  <line x1="13" y1="88" x2="107" y2="88"
    stroke="#1A3A5C" stroke-width="0.9" clip-path="url(#gc)"/>

  <!-- Filled area under epidemic curve -->
  <path d="M 14,88 C 22,84 30,70 40,50 S 53,26 62,21 S 76,30 88,54 S 100,77 106,88 Z"
    fill="rgba(6,182,212,0.07)"
    clip-path="url(#gc)"/>

  <!-- Epidemic curve — rises to peak then falls -->
  <path d="M 14,88 C 22,84 30,70 40,50 S 53,26 62,21 S 76,30 88,54 S 100,77 106,88"
    fill="none"
    stroke="url(#curveGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    clip-path="url(#gc)"
    filter="url(#glow)"/>

  <!-- Data points — rising phase -->
  <circle cx="14"  cy="88" r="2.6" fill="#10B981" clip-path="url(#gc)"/>
  <circle cx="35"  cy="64" r="2.6" fill="#10B981" clip-path="url(#gc)"/>
  <circle cx="52"  cy="34" r="2.6" fill="#06B6D4" clip-path="url(#gc)"/>

  <!-- Peak — alert -->
  <circle cx="62" cy="21" r="3.5"  fill="#EF4444" clip-path="url(#gc)" filter="url(#redglow)"/>
  <circle cx="62" cy="21" r="6.5"  fill="none" stroke="#EF4444" stroke-width="0.8" opacity="0.35" clip-path="url(#gc)"/>

  <!-- Data points — falling phase -->
  <circle cx="82"  cy="40" r="2.6" fill="#06B6D4" clip-path="url(#gc)"/>
  <circle cx="98"  cy="70" r="2.6" fill="#10B981" clip-path="url(#gc)"/>
</svg>
