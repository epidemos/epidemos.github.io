  bio: "<p>Jonathan studied <a href='http://www.ihs.ox.ac.uk/' target='_blank'>Human Sciences</a> at <a href='http://www.ox.ac.uk/' target='_blank'>Oxford University</a>, followed by postgraduate training in epidemiology at the <a href='http://www.lshtm.ac.uk/' target='_blank'>London School of Hygiene and Tropical Medicine</a> (LSHTM). He has worked in conducting and communicating biomedical research across a range of institutions including LSHTM, the <a href='http://who.int/en/' target='_blank'>World Health Organization</a> (WHO), <a href='http://www.msf.org/' target='_blank'>Médecins Sans Frontières</a> (MSF), and <a href='http://epicentre.msf.org/' target='_blank'>Epicentre</a>.</p><p>Jonathan has extensive field experience in humanitarian contexts, with a focus on neglected tropical disease epidemiology, mortality and malnutrition surveillance among displaced populations, rapid health assessments in sudden-onset crises, and outbreak investigation and response. He advises on research methodology in resource-limited settings, reproducible research practice, scientific communication, and local capacity building. He is a proficient programmer in <a href='https://www.r-project.org/' target='_blank'>R</a> and the <a href='http://shiny.rstudio.com/' target='_blank'>Shiny</a> framework, and is a member of the <a href='http://www.ease.org.uk/' target='_blank'>European Association of Science Editors</a>.</p>"

